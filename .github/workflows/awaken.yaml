name: Awaken

on:
  schedule:
    # Once a day, a few minutes after midnight in your timezone (17:10 UTC is 00:10 in UTC+7).
    - cron: "10 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [awaken.json]

permissions:
  contents: write

concurrency:
  group: awaken
  cancel-in-progress: true

jobs:
  awaken:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.METADATA_APP_ID }}
          private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4

      - uses: ngochieu642/git-profile-awaken@main
        with:
          # Optional: a fine-grained token with read access adds private contributions.
          token: ${{ steps.app-token.outputs.token || secrets.AWAKEN_TOKEN || github.token }}
